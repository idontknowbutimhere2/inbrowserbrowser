<!DOCTYPE html>
<html>

<head>
  <title>Cloud Browser</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    input {
      width: 60%;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-left: 10px;
    }

    iframe {
      width: 95%;
      height: 80vh;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>

<body>

  <h1>Cloud Browser</h1>

  <input id="url" placeholder="Enter website">
  <button onclick="openSite()">Open</button>

  <iframe id="frame"></iframe>

  <script>
    function openSite() {
      let url = document.getElementById("url").value;

      if (!url.startsWith("http")) {
        url = "https://" + url;
      }

      document.getElementById("frame").src = url;
    }
  </script>

</body>

</html>
