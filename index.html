<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>InBrowserBrowser</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: black;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;
    }

    .container {

      text-align: center;

      width: 100%;

      max-width: 700px;

      padding: 40px;
    }

    h1 {

      font-size: 72px;

      font-weight: 600;

      letter-spacing: 3px;

      margin-bottom: 70px;

      color: white;
    }

    .browser {

      width: 100%;

      padding: 28px;

      margin-bottom: 25px;

      border-radius: 18px;

      border: 2px solid #222;

      background: #111;

      color: white;

      font-size: 36px;

      font-weight: 500;

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.15s,
        border 0.2s;
    }

    .browser:hover {

      background: #1a1a1a;

      transform: scale(1.02);
    }

    .selected {

      border: 2px solid #39ff14;

      background: #111;

      box-shadow:
        0 0 20px rgba(57,255,20,0.2);
    }

    .start {

      margin-top: 30px;

      width: 100%;

      padding: 30px;

      border: none;

      border-radius: 18px;

      background: #39ff14;

      color: black;

      font-size: 38px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s,
        opacity 0.2s,
        box-shadow 0.2s;
    }

    .start:hover {

      transform: scale(1.02);

      opacity: 0.95;

      box-shadow:
        0 0 25px rgba(57,255,20,0.5);
    }

    .footer {

      margin-top: 40px;

      color: #555;

      font-size: 15px;

      letter-spacing: 2px;
    }

    /* LOADING SCREEN */

    .loading-screen {

      position: fixed;

      inset: 0;

      background: black;

      display: none;

      justify-content: center;

      align-items: center;

      flex-direction: column;

      z-index: 9999;

      overflow: hidden;
    }

    .loading-screen::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,255,0,0.03),
          rgba(0,255,0,0.03) 2px,
          transparent 2px,
          transparent 4px
        );

      pointer-events: none;

      animation: flicker 0.15s infinite;
    }

    .loading-title {

      color: #39ff14;

      font-size: 18px;

      letter-spacing: 6px;

      margin-bottom: 35px;

      text-transform: uppercase;

      font-family: monospace;

      text-shadow:
        0 0 5px #39ff14,
        0 0 15px #39ff14;
    }

    .loading-bar {

      width: 420px;

      height: 36px;

      border: 2px solid #39ff14;

      padding: 4px;

      position: relative;

      overflow: hidden;

      box-shadow:
        0 0 10px #39ff14,
        inset 0 0 10px rgba(57,255,20,0.3);
    }

    .loading-fill {

      height: 100%;

      width: 0%;

      background:
        linear-gradient(
          90deg,
          #0f0,
          #39ff14,
          #7dff5f
        );

      box-shadow:
        0 0 20px #39ff14;

      animation:
        loadBar 2.5s linear forwards,
        pulse 0.3s infinite;
    }

    @keyframes loadBar {

      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @keyframes pulse {

      0% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.8;
      }
    }

    @keyframes flicker {

      0% {
        opacity: 0.95;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.96;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>InBrowserBrowser</h1>

    <div
      id="chrome"
      class="browser selected"
      onclick="selectBrowser('chrome')">

      Chrome

    </div>

    <div
      id="firefox"
      class="browser"
      onclick="selectBrowser('firefox')">

      Firefox

    </div>

    <button
      class="start"
      onclick="startBrowser()">

      Start

    </button>

    <div class="footer">

      CLOUD BROWSING PLATFORM

    </div>

  </div>

  <!-- LOADING SCREEN -->

  <div
    id="loadingScreen"
    class="loading-screen">

    <div class="loading-title">

      Waking Browser Up...

    </div>

    <div class="loading-bar">

      <div class="loading-fill"></div>

    </div>

  </div>

  <script>

    let selected = "chrome";

    function selectBrowser(browser) {

      selected = browser;

      document
        .getElementById("chrome")
        .classList
        .remove("selected");

      document
        .getElementById("firefox")
        .classList
        .remove("selected");

      document
        .getElementById(browser)
        .classList
        .add("selected");
    }

    function getBrowserURL() {

      if (selected === "chrome") {

        return "https://inbrowserbrowser.onrender.com";

      } else {

        return "https://inbrowserbrowser-firefox.onrender.com";
      }
    }

    function startBrowser() {

      document
        .getElementById("loadingScreen")
        .style
        .display = "flex";

      setTimeout(() => {

        window.location.href = getBrowserURL();

      }, 2500);
    }

  </script>

</body>

</html>
